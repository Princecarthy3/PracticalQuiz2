<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- A-Frame Library -->

  <style>

<body>
  <!-- ================= TEXTURE GENERATION SCRIPTS ================= -->
  <script>
    /* Texture Generator for High-Fidelity Milo, Nido, Froth, Wood, Path & Sky */
    var Textures = {
      // 1. NESTLÉ MILO TIN LABEL (1024 x 512)
      createMilo: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;

        // Rich metallic green gradient
        var bgGrad = ctx.createLinearGradient(0, 0, w, 0);
        bgGrad.addColorStop(0.00, '#0a4f20');
        bgGrad.addColorStop(0.18, '#148536');
        bgGrad.addColorStop(0.36, '#0b5d25');
        bgGrad.addColorStop(0.50, '#1da344');
        bgGrad.addColorStop(0.64, '#0b5d25');
        bgGrad.addColorStop(0.82, '#148536');
        bgGrad.addColorStop(1.00, '#0a4f20');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        // Can ribbing micro-lines
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (var y = 26; y < h - 26; y += 6) { ctx.fillRect(0, y, w, 2); }
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        for (var y = 28; y < h - 26; y += 6) { ctx.fillRect(0, y, w, 2); }

        // Top metallic crimped seam
        var crimpTop = ctx.createLinearGradient(0, 0, 0, 24);
        crimpTop.addColorStop(0, '#e5e5e5');
        crimpTop.addColorStop(0.35, '#ffffff');
        crimpTop.addColorStop(0.7, '#9e9e9e');
        crimpTop.addColorStop(1, '#505050');
        ctx.fillStyle = crimpTop;
        ctx.fillRect(0, 0, w, 24);

        // Bottom metallic crimped seam
        var crimpBtm = ctx.createLinearGradient(0, h - 24, 0, h);
        crimpBtm.addColorStop(0, '#505050');
        crimpBtm.addColorStop(0.3, '#9e9e9e');
        crimpBtm.addColorStop(0.7, '#ffffff');
        crimpBtm.addColorStop(1, '#cccccc');
        ctx.fillStyle = crimpBtm;
        ctx.fillRect(0, h - 24, w, 24);

        // --- FRONT FACE: Center X = 512 ---
        var cx = 512;

        // Nestlé logo
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px "Georgia", serif';
        ctx.textAlign = 'center';
        ctx.fillText('Nestlé®', cx, 66);

        // Golden Energy Arcs
        ctx.save();
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#ffc800';
        ctx.beginPath();
        ctx.ellipse(cx - 20, 205, 175, 95, -Math.PI / 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#fff18a';
        ctx.stroke();
        ctx.restore();

        // Big Bold Stylized MILO Typography
        ctx.save();
        ctx.font = 'italic 900 115px "Arial Black", Impact, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Dark green drop shadow
        ctx.strokeStyle = '#042810';
        ctx.lineWidth = 18;
        ctx.strokeText('MILO', cx, 160);

        // Yellow glow border
        ctx.strokeStyle = '#ffdb00';
        ctx.lineWidth = 6;
        ctx.strokeText('MILO', cx, 160);

        // White core
        ctx.fillStyle = '#ffffff';
        ctx.fillText('MILO', cx, 160);
        ctx.restore();

        // Yellow ACTIV-GO Badge
        var rx = cx - 180, ry = 222, rw = 360, rh = 46;
        ctx.save();
        var ribGrad = ctx.createLinearGradient(rx, ry, rx + rw, ry);
        ribGrad.addColorStop(0, '#f28e00');
        ribGrad.addColorStop(0.25, '#ffca00');
        ribGrad.addColorStop(0.75, '#ffca00');
        ribGrad.addColorStop(1, '#f28e00');
        ctx.fillStyle = ribGrad;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(rx, ry, rw, rh, 10); else ctx.rect(rx, ry, rw, rh);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#005822';
        ctx.font = 'italic 900 30px "Arial Black", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ACTIV-GO®', cx, ry + 33);
        ctx.restore();

        // Protomalt line
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PROTOMALT • VITAMINS & MINERALS', cx, 298);

        // Athletic Sports Action Illustration
        ctx.save();
        var ax = cx - 90, ay = 370;
        ctx.fillStyle = '#ffcf10';
        ctx.beginPath();
        ctx.arc(ax, ay - 42, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#ffcf10';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ax, ay - 30);
        ctx.lineTo(ax + 8, ay - 10);
        ctx.lineTo(ax + 40, ay - 8); // kick leg
        ctx.moveTo(ax + 8, ay - 10);
        ctx.lineTo(ax - 12, ay + 20); // support leg
        ctx.moveTo(ax, ay - 22);
        ctx.lineTo(ax + 26, ay - 34); // arms
        ctx.moveTo(ax, ay - 22);
        ctx.lineTo(ax - 20, ay - 16);
        ctx.stroke();

        // Soccer ball
        ctx.beginPath();
        ctx.arc(ax + 54, ay - 14, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#053113';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Chocolate Malt Drink text
        ctx.fillStyle = '#ffe500';
        ctx.font = 'bold 22px "Arial Black", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('CHOCOLATE MALT DRINK', cx - 22, 360);

        ctx.fillStyle = '#ffffff';
        ctx.font = '14px Arial, sans-serif';
        ctx.fillText('ENERGY TO GO FURTHER', cx - 22, 386);

        ctx.fillStyle = '#e8f5e9';
        ctx.font = 'bold 17px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('NET WT. 400g e', cx, 442);

        // --- LEFT PANEL: Nutritional Compass (X: 45 - 285) ---
        ctx.fillStyle = '#ffffff';
        if (ctx.roundRect) ctx.roundRect(45, 45, 240, 390, 8); else ctx.fillRect(45, 45, 240, 390);
        ctx.fill();

        ctx.fillStyle = '#084f21';
        ctx.font = 'bold 15px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('NUTRITIONAL COMPASS®', 165, 72);

        ctx.strokeStyle = '#084f21';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(55, 82); ctx.lineTo(275, 82); ctx.stroke();

        ctx.fillStyle = '#222';
        ctx.font = '11px Arial, sans-serif';
        var nutMilo = [
          ['Energy', '1680 kJ / 398 kcal'],
          ['Protein', '12.3 g'],
          ['Fat, total', '9.8 g'],
          ['Carbohydrates', '64.5 g'],
          [' - Sugars', '45.2 g'],
          ['Dietary Fibre', '4.7 g'],
          ['Calcium', '520 mg (65% NRV)'],
          ['Iron', '14.5 mg (104% NRV)'],
          ['Vitamin D', '7.2 µg (144% NRV)'],
          ['Vitamin B2 / B6', '1.4 mg'],
          ['Vitamin C', '65 mg']
        ];
        for (var i = 0; i < nutMilo.length; i++) {
          var ny = 104 + i * 20;
          ctx.textAlign = 'left';
          ctx.fillText(nutMilo[i][0], 55, ny);
          ctx.textAlign = 'right';
          ctx.fillText(nutMilo[i][1], 275, ny);
          ctx.strokeStyle = '#e6e6e6';
          ctx.beginPath(); ctx.moveTo(55, ny + 4); ctx.lineTo(275, ny + 4); ctx.stroke();
        }
        ctx.fillStyle = '#084f21';
        ctx.font = 'bold 12px Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('GOOD FOOD, GOOD LIFE', 55, 360);
        ctx.fillStyle = '#444';
        ctx.font = '10px Arial, sans-serif';
        ctx.fillText('MILO with ACTIV-GO contains', 55, 380);
        ctx.fillText('vital nutrients for active days.', 55, 396);
        ctx.fillText('Servings per can: approx 20', 55, 412);

        // --- RIGHT PANEL: Directions & Barcode (X: 740 - 980) ---
        ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
        if (ctx.roundRect) ctx.roundRect(740, 45, 240, 390, 8); else ctx.fillRect(740, 45, 240, 390);
        ctx.fill();

        ctx.fillStyle = '#084f21';
        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('PREPARATION METHOD', 860, 75);

        ctx.fillStyle = '#333';
        ctx.font = '12px Arial, sans-serif';
        ctx.fillText('1. Scoop 3 heaped teaspoons (20g)', 860, 108);
        ctx.fillText('2. Add 200ml warm or cold milk', 860, 134);
        ctx.fillText('3. Stir well & enjoy champion taste!', 860, 160);

        // Cup & spoon icon
        ctx.fillStyle = '#084f21';
        ctx.beginPath();
        ctx.arc(860, 218, 24, 0, Math.PI);
        ctx.fill();
        ctx.fillRect(836, 198, 48, 20);

        // Barcode
        var bx = 765, by = 285, bw = 190, bh = 72;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx, by, bw, bh + 24);
        ctx.fillStyle = '#000000';
        var barP = [3, 1, 2, 4, 1, 3, 2, 1, 4, 2, 1, 3, 1, 4, 2, 1, 3, 2, 1, 4, 1, 2, 3, 1, 2, 4, 1, 3, 2, 1, 3, 2, 1, 4];
        var curX = bx + 8;
        for (var b = 0; b < barP.length; b++) {
          var bwf = barP[b];
          if (b % 2 === 0) ctx.fillRect(curX, by + 5, bwf * 2, bh - 10);
          curX += bwf * 2.6;
        }
        ctx.font = '12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('7 613032 104523', bx + bw / 2, by + bh + 16);

        ctx.fillStyle = '#084f21';
        ctx.font = 'bold 11px Arial, sans-serif';
        ctx.fillText('Nestlé Quality Guarantee', 860, 415);
      },

      // 2. NESTLÉ NIDO FORTIGROW TIN LABEL (1024 x 512)
      createNido: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;

        // Rich golden-yellow tinplate background
        var bgGrad = ctx.createLinearGradient(0, 0, w, 0);
        bgGrad.addColorStop(0.00, '#e89e00');
        bgGrad.addColorStop(0.18, '#fcb806');
        bgGrad.addColorStop(0.36, '#fed32b');
        bgGrad.addColorStop(0.50, '#ffe454');
        bgGrad.addColorStop(0.64, '#fed32b');
        bgGrad.addColorStop(0.82, '#fcb806');
        bgGrad.addColorStop(1.00, '#e89e00');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        // Can ridges
        ctx.fillStyle = 'rgba(255, 255, 255, 0.09)';
        for (var y = 28; y < h - 28; y += 7) { ctx.fillRect(0, y, w, 2); }
        ctx.fillStyle = 'rgba(180, 110, 0, 0.12)';
        for (var y = 30; y < h - 28; y += 7) { ctx.fillRect(0, y, w, 2); }

        // Top metallic crimped seam
        var crimpTop = ctx.createLinearGradient(0, 0, 0, 24);
        crimpTop.addColorStop(0, '#e5e5e5');
        crimpTop.addColorStop(0.35, '#ffffff');
        crimpTop.addColorStop(0.7, '#9e9e9e');
        crimpTop.addColorStop(1, '#505050');
        ctx.fillStyle = crimpTop;
        ctx.fillRect(0, 0, w, 24);

        // Bottom metallic crimped seam
        var crimpBtm = ctx.createLinearGradient(0, h - 24, 0, h);
        crimpBtm.addColorStop(0, '#505050');
        crimpBtm.addColorStop(0.3, '#9e9e9e');
        crimpBtm.addColorStop(0.7, '#ffffff');
        crimpBtm.addColorStop(1, '#cccccc');
        ctx.fillStyle = crimpBtm;
        ctx.fillRect(0, h - 24, w, 24);

        // --- FRONT FACE: Center X = 512 ---
        var cx = 512;

        // Nestlé logo in red
        ctx.fillStyle = '#d31b26';
        ctx.font = 'bold 26px "Georgia", serif';
        ctx.textAlign = 'center';
        ctx.fillText('Nestlé®', cx, 66);

        // Signature NIDO Curved Red Banner
        ctx.save();
        var bx = cx - 170, by = 86, bw = 340, bh = 94;
        ctx.beginPath();
        ctx.moveTo(bx + 15, by);
        ctx.quadraticCurveTo(cx, by - 12, bx + bw - 15, by);
        ctx.quadraticCurveTo(bx + bw + 15, by + bh / 2, bx + bw - 15, by + bh);
        ctx.quadraticCurveTo(cx, by + bh + 12, bx + 15, by + bh);
        ctx.quadraticCurveTo(bx - 15, by + bh / 2, bx + 15, by);
        ctx.closePath();

        var redGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
        redGrad.addColorStop(0, '#e5232d');
        redGrad.addColorStop(0.6, '#cc121a');
        redGrad.addColorStop(1, '#9b080f');
        ctx.fillStyle = redGrad;
        ctx.fill();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fbd444';
        ctx.stroke();

        // White Bold NIDO Text
        ctx.font = '900 88px "Arial Black", Arial, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;
        ctx.fillText('NIDO', cx, by + bh / 2 + 3);
        ctx.restore();

        // FortiGrow™ Green Shield Badge
        ctx.save();
        var sx = cx - 110, sy = 194, sw = 220, sh = 38;
        var sGrad = ctx.createLinearGradient(sx, sy, sx, sy + sh);
        sGrad.addColorStop(0, '#109139');
        sGrad.addColorStop(1, '#065a20');
        ctx.fillStyle = sGrad;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(sx, sy, sw, sh, 18); else ctx.rect(sx, sy, sw, sh);
        ctx.fill();
        ctx.strokeStyle = '#ffd83b';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'italic 900 22px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FortiGrow™', cx, sy + 26);
        ctx.restore();

        // Glass of Creamy White Milk Illustration with droplets
        ctx.save();
        var gx = cx, gy = 315;
        // Glass contour
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.moveTo(gx - 40, gy - 58);
        ctx.lineTo(gx - 28, gy + 45);
        ctx.quadraticCurveTo(gx, gy + 55, gx + 28, gy + 45);
        ctx.lineTo(gx + 40, gy - 58);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Fresh Milk fill
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(gx - 37, gy - 44);
        ctx.lineTo(gx - 26, gy + 42);
        ctx.quadraticCurveTo(gx, gy + 51, gx + 26, gy + 42);
        ctx.lineTo(gx + 37, gy - 44);
        ctx.quadraticCurveTo(gx, gy - 36, gx - 37, gy - 44);
        ctx.closePath();
        ctx.fill();

        // Milk droplets
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(gx - 46, gy - 58, 6, 0, Math.PI * 2);
        ctx.arc(gx + 48, gy - 62, 8, 0, Math.PI * 2);
        ctx.arc(gx + 30, gy - 76, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Product title
        ctx.fillStyle = '#08254b';
        ctx.font = 'bold 22px "Arial Black", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FULL CREAM MILK POWDER', cx, 395);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px Arial, sans-serif';
        ctx.fillText('CALCIUM • IRON • ZINC • VITAMIN A, C, D', cx, 420);

        ctx.fillStyle = '#c02129';
        ctx.font = 'bold 17px Arial, sans-serif';
        ctx.fillText('NET WT. 400g e', cx, 448);

        // --- LEFT PANEL: Nutrition Table (X: 45 - 285) ---
        ctx.fillStyle = '#ffffff';
        if (ctx.roundRect) ctx.roundRect(45, 45, 240, 390, 8); else ctx.fillRect(45, 45, 240, 390);
        ctx.fill();

        ctx.fillStyle = '#10529d';
        ctx.font = 'bold 15px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('NUTRITION INFORMATION', 165, 72);

        ctx.strokeStyle = '#10529d';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(55, 82); ctx.lineTo(275, 82); ctx.stroke();

        ctx.fillStyle = '#222';
        ctx.font = '11px Arial, sans-serif';
        var nutNido = [
          ['Energy', '2075 kJ / 496 kcal'],
          ['Fat, total', '26.2 g'],
          [' - Saturated Fat', '17.0 g'],
          ['Protein', '24.1 g'],
          ['Carbohydrates', '40.8 g'],
          [' - Lactose', '40.8 g'],
          ['Calcium', '860 mg (108% NRV)'],
          ['Iron', '10.5 mg (75% NRV)'],
          ['Zinc', '7.2 mg (72% NRV)'],
          ['Vitamin A', '650 µg RE'],
          ['Vitamin D', '9.5 µg (190% NRV)']
        ];
        for (var i = 0; i < nutNido.length; i++) {
          var ny = 104 + i * 20;
          ctx.textAlign = 'left';
          ctx.fillText(nutNido[i][0], 55, ny);
          ctx.textAlign = 'right';
          ctx.fillText(nutNido[i][1], 275, ny);
          ctx.strokeStyle = '#e6e6e6';
          ctx.beginPath(); ctx.moveTo(55, ny + 4); ctx.lineTo(275, ny + 4); ctx.stroke();
        }
        ctx.fillStyle = '#10529d';
        ctx.font = 'bold 12px Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('NUTRITIONAL DEFENCE', 55, 360);
        ctx.fillStyle = '#444';
        ctx.font = '10px Arial, sans-serif';
        ctx.fillText('Fortified with essential nutrients', 55, 380);
        ctx.fillText('to support bones, teeth & vitality.', 55, 396);
        ctx.fillText('Suitable for the whole family.', 55, 412);

        // --- RIGHT PANEL: Instructions & Barcode (X: 740 - 980) ---
        ctx.fillStyle = '#ffffff';
        if (ctx.roundRect) ctx.roundRect(740, 45, 240, 390, 8); else ctx.fillRect(740, 45, 240, 390);
        ctx.fill();

        ctx.fillStyle = '#10529d';
        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('HOW TO PREPARE', 860, 75);

        ctx.fillStyle = '#333';
        ctx.font = '12px Arial, sans-serif';
        ctx.fillText('For 1 Glass of Milk (250ml):', 860, 106);
        ctx.fillText('• 3 Tablespoons NIDO (32.5g)', 860, 132);
        ctx.fillText('• 225ml Previously boiled water', 860, 158);
        ctx.fillText('Stir gently until fully dissolved.', 860, 184);

        // Badge
        ctx.fillStyle = '#10529d';
        ctx.beginPath();
        ctx.arc(860, 226, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Arial, sans-serif';
        ctx.fillText('100%', 860, 232);

        // Barcode
        var bx = 765, by = 285, bw = 190, bh = 72;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx, by, bw, bh + 24);
        ctx.fillStyle = '#000000';
        var barP = [2, 3, 1, 4, 2, 1, 3, 2, 4, 1, 2, 3, 1, 4, 3, 1, 2, 4, 1, 3, 2, 1, 4, 2, 1, 3, 2, 4, 1, 3, 2, 1, 3, 2];
        var curX = bx + 8;
        for (var b = 0; b < barP.length; b++) {
          var bwf = barP[b];
          if (b % 2 === 0) ctx.fillRect(curX, by + 5, bwf * 2, bh - 10);
          curX += bwf * 2.6;
        }

        ctx.textAlign = 'center';
        ctx.fillText('7 613035 882104', bx + bw / 2, by + bh + 16);

      // 3. POLISHED TEAK WOOD GRAIN (512 x 512)
      createWood: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        var grad = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
        grad.addColorStop(0, '#9c5b2a');
        grad.addColorStop(0.45, '#7e451d');
        grad.addColorStop(0.85, '#683615');
        grad.addColorStop(1, '#4e250b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Concentric tree growth rings
        ctx.strokeStyle = 'rgba(40, 15, 5, 0.16)';
        for (var r = 10; r < w * 0.75; r += 5) {
          ctx.lineWidth = 1 + (Math.sin(r) > 0 ? 1.5 : 0.8);
          ctx.beginPath();
          ctx.arc(w / 2 + Math.sin(r * 0.1) * 6, h / 2 + Math.cos(r * 0.1) * 6, r, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Fine wood fibers
        ctx.strokeStyle = 'rgba(255, 230, 200, 0.07)';
        for (var i = 0; i < 400; i++) {
          var x = Math.random() * w;
          var y = Math.random() * h;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 15 + Math.random() * 25, y + (Math.random() - 0.5) * 3);
          ctx.stroke();
        }
      },

      // 4. STEAMING HOT MILO FROTH (256 x 256)
      createMiloFoam: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;

        // Rich chocolate liquid
        var grad = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
        grad.addColorStop(0, '#532810');
        grad.addColorStop(0.7, '#381a0b');
        grad.addColorStop(1, '#241006');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Cocoa foam bubbles
        for (var i = 0; i < 70; i++) {
          var r = 2 + Math.random() * 8;
          var x = w / 2 + (Math.random() - 0.5) * (w * 0.75);
          var y = h / 2 + (Math.random() - 0.5) * (h * 0.75);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(138, 77, 40, ' + (0.35 + Math.random() * 0.45) + ')';
          ctx.fill();
          ctx.strokeStyle = 'rgba(220, 140, 80, 0.25)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      },

      // 5. CREAMY LATTE ART (256 x 256)
      createLatteArt: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;

        // Warm latte cream
        var grad = ctx.createRadialGradient(w / 2, h / 2, 15, w / 2, h / 2, w / 2);
        grad.addColorStop(0, '#d9b382');
        grad.addColorStop(0.75, '#b98852');
        grad.addColorStop(1, '#825326');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // White foam leaf / rosette art
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#ffffff';

        // Central heart/leaf tip
        ctx.beginPath();
        ctx.arc(0, -38, 12, 0, Math.PI * 2);
        ctx.fill();

        // Stem
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(0, 45);
        ctx.stroke();

        // Feathered milk wings
        for (var i = -25; i <= 30; i += 11) {
          var span = 32 - Math.abs(i) * 0.6;
          ctx.beginPath();
          ctx.ellipse(-span / 2, i, span / 2, 5, -0.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(span / 2, i, span / 2, 5, 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      },

      // 6. FLAGSTONE PATHWAY TEXTURE (512 x 512)
      createStone: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        ctx.fillStyle = '#a89f91';
        ctx.fillRect(0, 0, w, h);

        // Paver stone slabs
        var rows = 6, cols = 4;
        var rh = h / rows, cw = w / cols;
        for (var r = 0; r < rows; r++) {
          var offset = (r % 2) * (cw / 2);
          for (var c = -1; c <= cols; c++) {
            var x = c * cw + offset;
            var y = r * rh;
            var shade = 175 + Math.floor((Math.sin(r * 3 + c * 7) * 0.5 + 0.5) * 35);
            ctx.fillStyle = 'rgb(' + shade + ',' + (shade - 8) + ',' + (shade - 18) + ')';
            ctx.fillRect(x + 2, y + 2, cw - 4, rh - 4);

            // Subtle surface flecks
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            for (var k = 0; k < 12; k++) {
              ctx.fillRect(x + Math.random() * (cw - 4), y + Math.random() * (rh - 4), 3, 3);
            }
          }
        }
      },

      // 7. REALISTIC GRADIENT SKY DOME (1024 x 512)
      createSky: function (canvas) {
        var ctx = canvas.getContext('2d');
        var w = canvas.width, h = canvas.height;
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        // Clear, crisp natural daytime azure sky
        grad.addColorStop(0.00, '#1976d2');
        grad.addColorStop(0.35, '#42a5f5');
        grad.addColorStop(0.68, '#90caf9');
        grad.addColorStop(0.88, '#e3f2fd');
        grad.addColorStop(1.00, '#ffffff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }
    };

    // Render all procedural textures into their DOM canvas elements
    function initAllTextures() {
      Textures.createMilo(document.getElementById('miloCanvas'));
      Textures.createNido(document.getElementById('nidoCanvas'));
      Textures.createWood(document.getElementById('woodCanvas'));
      Textures.createMiloFoam(document.getElementById('miloFoamCanvas'));
      Textures.createLatteArt(document.getElementById('latteArtCanvas'));
      Textures.createStone(document.getElementById('stoneCanvas'));
      Textures.createSky(document.getElementById('skyCanvas'));
    }
  </script>

  <!-- ================= CUSTOM AFRAME COMPONENTS ================= -->
  <script>
    /* Item Hover Glow Highlight (No captions on screen) */
    AFRAME.registerComponent('hover-highlight', {
      init: function () {
        var el = this.el;
        var setGlow = function (on) {
          el.object3D.traverse(function (o) {
            if (o.material && o.material.emissive) {
              if (on) {
                o.userData.e0 = o.material.emissive.getHex();
                o.material.emissive.set('#ffea00');
                o.material.emissiveIntensity = 0.45;
              } else if (o.userData.e0 !== undefined) {
                o.material.emissive.setHex(o.userData.e0);
                o.material.emissiveIntensity = 0;
              }
            }
          });
        };

        el.addEventListener('mouseenter', function () { setGlow(true); });
        el.addEventListener('mouseleave', function () { setGlow(false); });
      }
    });

    /* Garden Armchair Component */
    AFRAME.registerComponent('garden-chair', {
      schema: {
        wood: { default: '#633918' },
        cushion: { default: '#9e1b27' }
      },
      init: function () {
        var el = this.el, d = this.data;
        function box(w, h, dp, x, y, z, c, met, rough) {
          var b = document.createElement('a-box');
          b.setAttribute('width', w); b.setAttribute('height', h); b.setAttribute('depth', dp);
          b.setAttribute('position', x + ' ' + y + ' ' + z);
          b.setAttribute('material', 'color: ' + c + '; metalness: ' + (met || 0.1) + '; roughness: ' + (rough || 0.7));
          el.appendChild(b);
          return b;
        }

        // Seat base & plush fabric cushion
        box(0.50, 0.04, 0.50, 0, 0.43, 0, d.wood);
        box(0.46, 0.05, 0.46, 0, 0.47, 0, d.cushion, 0.05, 0.9);

        // 4 Legs with cross braces
        var legPos = [[-0.21, -0.21], [0.21, -0.21], [-0.21, 0.21], [0.21, 0.21]];
        legPos.forEach(function (p) {
          box(0.045, 0.43, 0.045, p[0], 0.215, p[1], d.wood);
        });
        box(0.42, 0.02, 0.02, 0, 0.14, 0.21, d.wood); // back stretcher
        box(0.42, 0.02, 0.02, 0, 0.14, -0.21, d.wood); // front stretcher

        // Backrest frame & vertical slats
        box(0.04, 0.48, 0.04, -0.21, 0.69, 0.22, d.wood); // left post
        box(0.04, 0.48, 0.04, 0.21, 0.69, 0.22, d.wood); // right post
        box(0.48, 0.06, 0.04, 0, 0.92, 0.22, d.wood);   // top crest rail
        for (var s = -0.12; s <= 0.12; s += 0.08) {
          box(0.025, 0.40, 0.015, s, 0.67, 0.22, d.wood); // vertical slats
        }

        // Armrests
        box(0.04, 0.02, 0.44, -0.23, 0.64, 0.01, d.wood); // left armrest
        box(0.04, 0.02, 0.44, 0.23, 0.64, 0.01, d.wood);  // right armrest
        box(0.03, 0.19, 0.03, -0.23, 0.53, -0.19, d.wood); // arm support
        box(0.03, 0.19, 0.03, 0.23, 0.53, -0.19, d.wood);
      }
    });

    /* Animated Rising Steam Effect */
    AFRAME.registerComponent('rising-steam', {
      schema: { speed: { default: 1 } },
      init: function () {
        var el = this.el;
        for (var i = 0; i < 4; i++) {
          var puff = document.createElement('a-sphere');
          puff.setAttribute('radius', 0.01 + i * 0.005);
          puff.setAttribute('material', 'color: #ffffff; opacity: 0.28; transparent: true; roughness: 1; shader: standard');
          puff.setAttribute('position', ((Math.random() - 0.5) * 0.015) + ' 0.02 ' + ((Math.random() - 0.5) * 0.015));

          var dur = 2200 + i * 400;
          var delay = i * 500;
          puff.setAttribute('animation__rise', {
            property: 'position',
            to: ((Math.random() - 0.5) * 0.04) + ' 0.22 ' + ((Math.random() - 0.5) * 0.04),
            dur: dur,
            easing: 'easeOutQuad',
            loop: true,
            delay: delay
          });
          puff.setAttribute('animation__fade', {
            property: 'material.opacity',
            from: 0.35,
            to: 0,
            dur: dur,
            easing: 'linear',
            loop: true,
            delay: delay
          });
          puff.setAttribute('animation__scale', {
            property: 'scale',
            from: '0.6 0.6 0.6',
            to: '2.8 2.8 2.8',
            dur: dur,
            easing: 'easeOutQuad',
            loop: true,
            delay: delay
          });
          el.appendChild(puff);
        }
      }
    });
  </script>

  <!-- ================= KEYBOARD VIEW SWITCHER (OPTIONAL HOTKEYS: 1, 2, 3) ================= -->
  <script>
    // Smooth camera view hotkeys without any UI overlay:
    // Press '1': Gazebo Entrance
    // Press '2': Table Close-Up
    // Press '3': Walkway Path
    window.addEventListener('keydown', function (e) {
      var rig = document.getElementById('camera-rig');
      if (!rig) return;
      if (e.key === '1') {
        rig.setAttribute('animation', { property: 'position', to: '0 0 3.2', dur: 1000, easing: 'easeInOutQuad' });
      } else if (e.key === '2') {
        rig.setAttribute('animation', { property: 'position', to: '0 0 1.65', dur: 1000, easing: 'easeInOutQuad' });
      } else if (e.key === '3') {
        rig.setAttribute('animation', { property: 'position', to: '0 0 8.8', dur: 1000, easing: 'easeInOutQuad' });
      }
    });

    // Ensure all canvas textures are refreshed once scene finishes loading
    document.querySelector('a-scene').addEventListener('loaded', function () {
      var mats = document.querySelectorAll('[material]');
      mats.forEach(function (el) {
        var obj = el.getObject3D('mesh');
        if (obj) {
          obj.traverse(function (child) {
            if (child.material && child.material.map) {
              child.material.map.needsUpdate = true;
            }
          });
        }
      });
    });
  </script>
